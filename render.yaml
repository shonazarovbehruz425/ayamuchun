services:
  - type: web
    name: edubot
    env: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: AI_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: AI_PROVIDER
        value: "gemini"
      - key: AI_BASE_URL
        sync: false
      - key: AI_MODEL
        sync: false
      - key: AI_DISPLAY_NAME
        value: "EduBot AI"
      - key: WEBAPP_URL
        sync: false
      - key: STORAGE_PATH
        value: ./storage
      - key: PYTHONUNBUFFERED
        value: "1"
