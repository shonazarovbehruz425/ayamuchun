<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>EduBot - Teacher Workspace</title>
    
    <!-- Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        // Immediate Fullscreen & Expand activation at earliest head execution
        (function() {
            function activateFullscreen() {
                try {
                    var tw = window.Telegram && window.Telegram.WebApp;
                    if (tw) {
                        tw.ready();
                        tw.expand();
                        if (tw.requestFullscreen && !tw.isFullscreen) {
                            tw.requestFullscreen();
                        }
                        if (tw.disableVerticalSwipes) {
                            tw.disableVerticalSwipes();
                        }
                    }
                } catch(e) {}
            }
            activateFullscreen();
            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', activateFullscreen);
            }
            window.addEventListener('load', activateFullscreen);
            setTimeout(activateFullscreen, 50);
            setTimeout(activateFullscreen, 150);
            setTimeout(activateFullscreen, 350);
        })();
    </script>
    
    <!-- Tailwind CSS Play CDN & Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Premium Typography: Plus Jakarta Sans (Headings/UI) + Inter (Body) + JetBrains Mono (Numbers/Badges) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'Inter', 'system-ui', '-apple-system', 'sans-serif'],
                        mono: ['"JetBrains Mono"', 'monospace'],
                    },
                    colors: {
                        brand: {
                            50: '#eef2ff',
                            100: '#e0e7ff',
                            500: '#6366f1',
                            600: '#4f46e5',
                            700: '#4338ca',
                        }
                    }
                }
            }
        }
    </script>
    
    <link rel="stylesheet" href="css/style.css?v=20.0">
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen select-none">

    <!-- Top Navigation Bar / Header with Liquid Glass effect -->
    <header class="sticky top-0 z-40 liquid-glass-header px-4 pb-3.5 sm:px-6 md:px-8" style="padding-top: 70px !important;">
        <div class="max-w-xl md:max-w-3xl lg:max-w-4xl mx-auto flex items-center justify-between">
            <div class="flex items-center gap-2.5">
                <div class="w-9 h-9 sm:w-10 sm:h-10 rounded-xl bg-gradient-to-tr from-brand-700 via-brand-600 to-indigo-500 flex items-center justify-center text-white shadow-md shadow-brand-500/25 ring-1 ring-white/50 shrink-0">
                    <i data-lucide="graduation-cap" class="w-5 h-5"></i>
                </div>
                <div>
                    <h1 class="text-base sm:text-lg font-bold text-slate-900 leading-none">EduBot</h1>
                    <p class="text-xs text-slate-500 mt-0.5">O'qituvchi ish stoli</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <!-- Theme Switcher (Day / Night) -->
                <button id="theme-toggle-btn" class="liquid-glass-pill p-2 rounded-full text-slate-700 dark:text-slate-200 hover:text-brand-600 transition-colors flex items-center justify-center cursor-pointer shrink-0" title="Kunduzgi / Kechki rejim">
                    <i id="theme-icon-moon" data-lucide="moon" class="w-4 h-4"></i>
                    <i id="theme-icon-sun" data-lucide="sun" class="w-4 h-4 hidden text-amber-400"></i>
                </button>

                <div id="user-badge" class="flex items-center gap-1.5 px-3 py-1 rounded-full liquid-glass-pill text-xs font-semibold text-slate-700 dark:text-slate-200 shrink-0">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse shrink-0"></span>
                    <span id="header-user-name" class="max-w-[85px] sm:max-w-[150px] truncate block">O'qituvchi</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Container Content (rendered by app.js) -->
    <main id="app" class="max-w-xl md:max-w-3xl lg:max-w-4xl mx-auto px-4 sm:px-6 md:px-8 pt-5 pb-8">
        <!-- Dynamic views injected here -->
    </main>

    <!-- Ultra-futuristic iOS 26 Liquid Glass Floating Dock -->
    <div class="fixed bottom-3 left-0 right-0 z-50 px-3 sm:px-6 flex justify-center w-full pointer-events-none" style="padding-bottom: max(env(safe-area-inset-bottom, 0px), var(--tg-safe-area-inset-bottom, 0px));">
        <div id="dockContainer" class="relative max-w-lg md:max-w-xl w-full pointer-events-auto">
            
            <!-- Subtle gradient shield preventing bottom content peeking under dock -->
            <div class="dock-backdrop-shield"></div>

            <!-- Ambient Glow Behind Dock -->
            <div id="ambientAura" class="absolute -inset-1.5 bg-gradient-to-r from-indigo-500/15 via-purple-500/15 to-sky-500/15 rounded-[44px] blur-lg opacity-75 -z-10 pointer-events-none"></div>

            <nav class="ios26-glass-chassis relative flex items-center justify-between">
                
                <!-- Prismatic Light-Splitting Border (Chromatic Aberration) -->
                <div class="chromatic-rim"></div>
                
                <!-- Interactive Fresnel Specular Flash -->
                <div class="specular-glare"></div>

                <!-- 3D Liquid Mercury Sliding Capsule (iOS 26 Floating Indicator) -->
                <div id="mercuryCapsule" class="mercury-capsule"></div>

                <!-- ITEM 1: Asosiy (Quad Tiles) -->
                <a href="#/" onclick="navigateTo('#/'); return false;" class="ios-tab-btn nav-item active-tab flex-1 flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-[30px] text-xs font-bold text-white cursor-pointer" data-route="#/">
                    <svg class="w-4 h-4 shrink-0 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="2.4"></rect>
                        <rect x="14" y="3" width="7" height="7" rx="2.4"></rect>
                        <rect x="14" y="14" width="7" height="7" rx="2.4"></rect>
                        <rect x="3" y="14" width="7" height="7" rx="2.4"></rect>
                    </svg>
                    <span class="tracking-tight font-bold">Asosiy</span>
                </a>

                <!-- ITEM 2: AI (4-Point Star + Satellite Core) -->
                <a href="#/ai" onclick="navigateTo('#/ai'); return false;" class="ios-tab-btn nav-item flex-1 flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-[30px] text-xs font-semibold text-slate-400 cursor-pointer" data-route="#/ai">
                    <svg class="w-4 h-4 shrink-0 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3L12 3Z"></path>
                        <circle cx="19" cy="5" r="1.5" fill="currentColor"></circle>
                        <circle cx="6" cy="18" r="1.2" fill="currentColor"></circle>
                    </svg>
                    <span class="tracking-tight">AI</span>
                </a>

                <!-- ITEM 4: Profil (Precision Parameters) -->
                <a href="#/settings" onclick="navigateTo('#/settings'); return false;" class="ios-tab-btn nav-item flex-1 flex items-center justify-center gap-1.5 py-2.5 px-2 rounded-[30px] text-xs font-semibold text-slate-400 cursor-pointer" data-route="#/settings">
                    <svg class="w-4 h-4 shrink-0 transition-transform duration-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="7" x2="13" y2="7"></line>
                        <circle cx="15.5" cy="7" r="2.5"></circle>
                        <line x1="18" y1="7" x2="20" y2="7"></line>
                        <line x1="4" y1="17" x2="8" y2="17"></line>
                        <circle cx="10.5" cy="17" r="2.5"></circle>
                        <line x1="13" y1="17" x2="20" y2="17"></line>
                    </svg>
                    <span class="tracking-tight">Profil</span>
                </a>

            </nav>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/telegram.js?v=20.0"></script>
    <script src="js/api.js?v=20.0"></script>
    <script src="js/app.js?v=20.0"></script>
</body>
</html>
